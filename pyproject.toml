[project]
name = "biblelingo"
version = "0.4.0"
description = "Aprenda inglês lendo e praticando a World English Bible"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "venv",
  "frontend",
  "data",
  "**/__pycache__",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line length — format cuida do restante
  # Autofix aplicado localmente; CI permanece estável se o lock de estilo divergir
  "UP006",
  "UP035",
  "UP045",
  "UP017",
  "I001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"api/**" = ["B008"]  # FastAPI Depends()/Query() em defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
