name: Generate Python lock (temporary)

on:
  push:
    branches: [chore/python-lock]
    paths:
      - ".github/workflows/generate-python-lock-temp.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/python-lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve current dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Write deployment lock
        run: |
          {
            echo "# Generated from requirements.txt on GitHub Actions"
            echo "# Target: CPython 3.12 on Linux (CI/Docker)"
            echo "# Regenerate intentionally; do not hand-edit."
            python -m pip freeze --local | LC_ALL=C sort
          } > requirements.lock.txt

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt
          if git diff --cached --quiet; then
            echo "Lock unchanged"
            exit 0
          fi
          git commit -m "chore(deps): gera lock Python reproduzível"
          git push origin HEAD:chore/python-lock
