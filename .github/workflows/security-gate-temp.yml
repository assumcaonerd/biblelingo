name: Security gate temporary

on:
  push:
    branches: [ci/security-gate]
    paths:
      - ".github/workflows/security-gate-temp.yml"

permissions:
  contents: write

jobs:
  patch-security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/security-gate

      - name: Patch CI security gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')

          old = '''    # Fase 2.1: só coleta material de triagem. Não bloqueia merge.\n    # Gate real = remover continue-on-error E os || true dos comandos bloqueantes.\n    continue-on-error: true\n'''
          new = '''    # Fase 2.4: coleta relatórios completos e aplica gate explícito no fim.\n    # Política: npm full bloqueia high+, npm produção bloqueia moderate+, pip-audit bloqueia qualquer vulnerabilidade conhecida.\n'''
          if old not in text:
              raise SystemExit('security job marker not found')
          text = text.replace(old, new, 1)

          old_summary = '          lines.append("Gate ainda NÃO ativo. Classificar runtime vs dev antes de bloquear.")\n'
          new_summary = '          lines.append("Gate ATIVO: npm full high+, npm production moderate+, pip-audit qualquer vulnerabilidade conhecida.")\n'
          if old_summary not in text:
              raise SystemExit('summary gate marker not found')
          text = text.replace(old_summary, new_summary, 1)

          marker = '''      - name: Upload audit artifacts\n        if: always()\n        uses: actions/upload-artifact@v4\n'''
          gate = '''      - name: Enforce dependency audit gate\n        run: |\n          echo "Gate npm full: high/critical"\n          (cd frontend && npm audit --audit-level=high)\n          echo "Gate npm production: moderate+"\n          (cd frontend && npm audit --omit=dev --audit-level=moderate)\n          echo "Gate Python: qualquer vulnerabilidade conhecida"\n          pip-audit -r requirements.txt\n\n'''
          if marker not in text:
              raise SystemExit('upload marker not found')
          text = text.replace(marker, gate + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -n "Fase 2.4\|Enforce dependency audit gate\|Gate ATIVO" .github/workflows/ci.yml

      - name: Commit CI gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci(security): ativa gate de dependencias"
          git push origin HEAD:ci/security-gate
