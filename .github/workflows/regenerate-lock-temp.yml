name: Regenerate package lock temporary

on:
  push:
    branches:
      - fix/phase1-quiz-integrity
    paths:
      - .github/workflows/regenerate-lock-temp.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore(frontend): sincroniza package-lock com package.json"
          git push origin HEAD:fix/phase1-quiz-integrity
