name: Router bump temporary

on:
  push:
    branches: [fix/react-router-7]
    paths:
      - ".github/workflows/router-bump-temp.yml"

permissions:
  contents: write

jobs:
  bump-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/react-router-7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update React Router only
        working-directory: frontend
        run: npm install react-router-dom@7.18.2 --save

      - name: Verify production audit
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Commit package manifest and lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "fix(deps): atualiza react-router-dom para 7.18.2"
          git push origin HEAD:fix/react-router-7
