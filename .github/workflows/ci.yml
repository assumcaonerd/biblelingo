name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m compileall app api tests main.py

      - name: Validate Bible and dictionary JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("data").glob("*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path.name} ({type(data).__name__})")
          PY

      - name: Run unit and API tests
        env:
          BIBLELINGO_SECRET_KEY: ci-test-secret-not-for-production
        run: |
          python -m unittest discover -s tests -v

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck and build
        run: npm run build
