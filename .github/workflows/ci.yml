name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check app api tests main.py

      - name: Compile Python modules
        run: python -m compileall app api tests main.py

      - name: Validate content JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("data").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path.name} ({type(data).__name__})")
          PY

      - name: Unit and integration tests
        env:
          BIBLELINGO_ENV: test
          BIBLELINGO_SECRET_KEY: ci-test-secret-not-for-production
          BIBLELINGO_CORS_ORIGINS: http://127.0.0.1:5173
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install --no-save \
            eslint @eslint/js typescript-eslint eslint-plugin-react-hooks eslint-plugin-react-refresh globals \
            vitest jsdom @testing-library/react @testing-library/jest-dom @testing-library/user-event

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests (Vitest)
        run: npm test

      - name: Typecheck and build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install --no-save @playwright/test

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start API
        env:
          BIBLELINGO_ENV: test
          BIBLELINGO_SECRET_KEY: ci-e2e-secret-not-for-production
          BIBLELINGO_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
          BIBLELINGO_DB_PATH: data/e2e-ci.db
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1

      - name: Run Playwright
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_API_URL: http://127.0.0.1:8000
        run: npx playwright test
