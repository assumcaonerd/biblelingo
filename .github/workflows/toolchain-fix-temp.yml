name: Toolchain fix temporary

on:
  push:
    branches: [fix/toolchain-audit]
    paths:
      - ".github/workflows/toolchain-fix-temp.yml"

permissions:
  contents: write

jobs:
  fix-toolchain-peer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toolchain-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update Vite React plugin
        working-directory: frontend
        run: npm install @vitejs/plugin-react@6.0.5 --save-dev

      - name: Verify reproducible install
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify full npm audit
        working-directory: frontend
        run: npm audit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Commit package manifest and lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "fix(deps): alinha plugin React ao Vite 8"
          git push origin HEAD:fix/toolchain-audit
