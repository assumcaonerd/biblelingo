services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # development facilita o primeiro `docker compose up` local
      BIBLELINGO_ENV: ${BIBLELINGO_ENV:-development}
      BIBLELINGO_SECRET_KEY: ${BIBLELINGO_SECRET_KEY:-dev-secret-change-me-in-production-32chars}
      BIBLELINGO_DB_PATH: /app/data/biblelingo.db
      BIBLELINGO_CORS_ORIGINS: ${BIBLELINGO_CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5173}
    volumes:
      - biblelingo_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  biblelingo_data:
